<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOS Explainer</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="rect">
        
        <div class="popup" style="display: none;">
            <p id="poptext">
                <span id="red">!! </span> Enter some text <span id="red"> !!</span>
            </p>

            <button id="pop">Ok</button>
        </div>

        <header class="header">
            <img src="img/header.png" alt="textual icon" id="header-img">
            <h1 id="head">Terms of Service Explainer</h1>
        </header>

        <div class="textarea">
            <textarea name="text" id="text" placeholder="Paste the text here..."></textarea>

        </div>

        <div class="buttons">
            <button type="button" id="button">Analyze Text</button>
            <button type="button" id="button2" style="display: none;">Try Another</button>
        </div>


        <div id="explain" class="explain" style="display: none;">
            <div class="img-title">
                <img id="img" src="img/explanation.png" class="img">
                <h4 id="h4">Explanation</h4>
            </div>
            <div id="output"></div>

        </div>

        <script src="script.js"></script>
</body>

</html>
