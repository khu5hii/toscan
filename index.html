<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOS Explainer</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

<body>
    <div class="rect">

        <header class="header">
            <img src="img/header.png" alt="textual icon" id="header-img">

        <div class="textarea">
            <textarea name="text" id="text" placeholder="Paste the text here..." ></textarea>
            <!-- <h5>Paste the text here...</h5> -->
        </div>

        <button type="button">Analyze Text</button>

        <!-- <div class="explain">
            <img src="img/explanation.png" alt="explanation icon">

        </div> -->

    </div>

</html>
